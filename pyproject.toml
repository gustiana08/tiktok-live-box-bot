[project]
name = "tiktok-live-box-bot"
version = "1.0.0"
description = "Bot otomatis deteksi kotak keberuntungan (lucky box/treasure box) di TikTok Live, kirim notifikasi ke Telegram"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "TikTokLive>=6.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
